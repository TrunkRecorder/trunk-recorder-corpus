# Checks contributed recordings: is each what it says it is? It runs the latest released
# trunk-pro, and publishes waterfalls and counts. Uploads are untrusted input, so this job has
# no write access to any repo: only a token to ask what's waiting, and each upload's own for its results.
name: decode

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decode

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: The latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo TrunkRecorder/trunk-recorder-pro --pattern 'trunk-pro-*-linux-x86_64.tar.gz' --dir /tmp/rel
          tar -xzf /tmp/rel/*.tar.gz -C /tmp/rel
          cp "$(find /tmp/rel -type f -name trunk-pro | head -1)" /tmp/trunk-pro
      - name: Check what's waiting
        env:
          DECODE_TOKEN: ${{ secrets.DECODE_TOKEN }}
        run: python3 scripts/decode.py /tmp/trunk-pro https://trunkrecorder.pro/corpus/api/v1
