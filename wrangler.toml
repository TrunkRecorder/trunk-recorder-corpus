# trunkrecorder.pro/corpus: uploads of IQ recordings, and the public pages listing them.
# See research/iq-corpus.md in TrunkRecorder/trunk-recorder-pro.

name = "trunk-recorder-corpus"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "trunkrecorder.pro/corpus*", zone_name = "trunkrecorder.pro" }]

[vars]
MANIFEST_URL = "https://raw.githubusercontent.com/TrunkRecorder/trunk-recorder-pro/main/corpus/corpus.json"
BLOB_URL = "https://iq.trunkrecorder.pro/blobs/"

# Made with `wrangler d1 create corpus`.
[[d1_databases]]
binding = "DB"
database_name = "corpus"
database_id = "d1198978-cf81-46f5-b201-b4a1bcd37eb3"
migrations_dir = "migrations"

# The recordings. Public, on the custom domain iq.trunkrecorder.pro.
[[r2_buckets]]
binding = "IQ"
bucket_name = "trp-iq"

# Retention: every day.
[triggers]
crons = ["17 4 * * *"]

# Secrets (`wrangler secret put`): ADMIN_TOKEN (the corpus-remove workflow's) and
# DECODE_TOKEN (the decode job's, to ask what's waiting: this repo's secret of that name).
